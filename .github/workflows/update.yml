name: update
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests pandas numpy matplotlib
      - name: restore previous deploy (state + charts)
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" publish 2>/dev/null || mkdir -p publish
          rm -rf publish/.git
      - name: run the update
        env:
          PUBLISH_DIR: ${{ github.workspace }}/publish
        run: python engine/run_all.py
      - name: publish (single-commit gh-pages, no history growth)
        run: |
          cd publish
          git init -q -b gh-pages
          git config user.name "hub-bot"
          git config user.email "hub-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
      - name: heartbeat (keeps scheduled runs enabled)
        run: |
          d=$(date -u +%Y-%m-%d)
          if [ "$(cat heartbeat.txt 2>/dev/null)" != "$d" ]; then
            echo "$d" > heartbeat.txt
            git config user.name "hub-bot"; git config user.email "hub-bot@users.noreply.github.com"
            git add heartbeat.txt && git commit -q -m "heartbeat $d" && git push -q origin HEAD:main || true
          fi
